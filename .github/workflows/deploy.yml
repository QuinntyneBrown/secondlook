name: Deploy to Azure

# Every push to main: test gates -> infrastructure (Bicep, idempotent) ->
# EF migrations -> API -> the two Static Web Apps (secondlook, admin) -> smoke.
#
# Azure access is OpenID Connect (azure/login with a federated credential), so
# the only long-lived secrets are the ones the app itself needs. Static Web App
# deployment tokens are read from Azure at run time, never stored in GitHub.
#
# One-time setup, then these repository secrets:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (federated credential
#     for ref refs/heads/main with Contributor on the resource group)
#   SQL_ADMIN_LOGIN, SQL_ADMIN_PASSWORD, SECONDLOOK_JWT_SIGNING_KEY (32+ chars)
# Optional repository variables: APP_CUSTOM_DOMAIN, ADMIN_CUSTOM_DOMAIN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: secondlook-rg
  AZURE_LOCATION: canadacentral
  DOTNET_VERSION: '10.0.101'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NODE_VERSION: '22'
  API_PROJECT: backend/src/SecondLook.Api/SecondLook.Api.csproj
  CLI_PROJECT: backend/src/SecondLook.Cli/SecondLook.Cli.csproj

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Nothing reaches Azure unless the backend and frontend suites are green.
  test-backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build and test
        shell: pwsh
        run: ./eng/Test-Backend.ps1 -Configuration Release

  test-frontend:
    name: Frontend lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular workspace deps
        working-directory: frontend
        run: npm ci

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build libraries
        working-directory: frontend
        run: |
          npx ng build api
          npx ng build components

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --watch=false

  # Converges secondlook-rg on eng/infra/main.bicep: plan, API, SQL and the two
  # Static Web Apps. A torn-down stack comes back on the next push.
  infra:
    name: Provision Azure (Bicep)
    runs-on: ubuntu-24.04
    needs: [test-backend, test-frontend]
    outputs:
      api_name: ${{ steps.deploy.outputs.api_name }}
      api_origin: ${{ steps.deploy.outputs.api_origin }}
      web_swa: ${{ steps.deploy.outputs.web_swa }}
      web_host: ${{ steps.deploy.outputs.web_host }}
      admin_swa: ${{ steps.deploy.outputs.admin_swa }}
      admin_host: ${{ steps.deploy.outputs.admin_host }}
      sql_fqdn: ${{ steps.deploy.outputs.sql_fqdn }}
      sql_db: ${{ steps.deploy.outputs.sql_db }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --tags app=secondlook managedBy=bicep \
            --output none

      - name: Deploy eng/infra/main.bicep
        id: deploy
        env:
          # main.bicepparam reads these with readEnvironmentVariable().
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SECONDLOOK_JWT_SIGNING_KEY: ${{ secrets.SECONDLOOK_JWT_SIGNING_KEY }}
          APP_CUSTOM_DOMAIN: ${{ vars.APP_CUSTOM_DOMAIN }}
          ADMIN_CUSTOM_DOMAIN: ${{ vars.ADMIN_CUSTOM_DOMAIN }}
        run: |
          for v in SQL_ADMIN_LOGIN SQL_ADMIN_PASSWORD SECONDLOOK_JWT_SIGNING_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing $v. Set it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          outputs="$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name secondlook-infra \
            --template-file eng/infra/main.bicep \
            --parameters eng/infra/main.bicepparam \
            --query properties.outputs \
            --output json)"

          out() { jq -r --arg k "$1" '.[$k].value' <<<"$outputs"; }
          {
            echo "api_name=$(out apiName)"
            echo "api_origin=$(out apiOrigin)"
            echo "web_swa=$(out webSwaName)"
            echo "web_host=$(out webSwaHostName)"
            echo "admin_swa=$(out adminSwaName)"
            echo "admin_host=$(out adminSwaHostName)"
            echo "sql_fqdn=$(out sqlServerFqdn)"
            echo "sql_db=$(out sqlDatabaseName)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Azure resources"
            echo
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| API | $(out apiOrigin) |"
            echo "| Buyer app | https://$(out webSwaHostName) |"
            echo "| Admin app | https://$(out adminSwaHostName) |"
            echo "| SQL | $(out sqlServerFqdn) / $(out sqlDatabaseName) |"
            echo "| CORS origins | $(jq -r '.corsOrigins.value | join(", ")' <<<"$outputs") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Schema first: the API never migrates on startup, and additive migrations
  # keep the previous API build working until the new one lands.
  migrate:
    name: Apply EF migrations
    runs-on: ubuntu-24.04
    needs: [infra]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The server admits Azure services and, for the length of this job, this
      # runner. The rule is named after the run so a stale one is obvious.
      - name: Open the SQL firewall for this runner
        id: firewall
        run: |
          ip="$(curl -fsS https://api.ipify.org)"
          server="${{ needs.infra.outputs.sql_fqdn }}"
          server="${server%%.*}"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$server" \
            --name "gha-${{ github.run_id }}" \
            --start-ip-address "$ip" \
            --end-ip-address "$ip" \
            --output none

      - name: secondlook migrate
        env:
          SQL_FQDN: ${{ needs.infra.outputs.sql_fqdn }}
          SQL_DB: ${{ needs.infra.outputs.sql_db }}
          SQL_ADMIN_LOGIN: ${{ secrets.SQL_ADMIN_LOGIN }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          conn="Server=tcp:${SQL_FQDN},1433;Initial Catalog=${SQL_DB};User ID=${SQL_ADMIN_LOGIN};Password=${SQL_ADMIN_PASSWORD};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
          echo "::add-mask::$conn"
          dotnet run --project "$CLI_PROJECT" -c Release -- migrate --provider SqlServer --connection "$conn"

      - name: Close the SQL firewall
        if: always() && steps.firewall.outputs.server != ''
        run: |
          az sql server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "${{ steps.firewall.outputs.server }}" \
            --name "gha-${{ github.run_id }}" \
            --output none

  api:
    name: Build and deploy API
    runs-on: ubuntu-24.04
    needs: [infra, migrate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish "$API_PROJECT" -c Release -o ./publish --nologo

      - name: Zip publish output
        run: cd publish && zip -qr ../api.zip .

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ needs.infra.outputs.api_name }}" \
            --src-path api.zip \
            --type zip \
            --clean true \
            --restart true \
            --async false \
            --output none

  # Both apps are built here, after Bicep, because the API origin is only known
  # then: it is written into environment.prod.ts (apiBaseUrl is '' in source).
  web:
    name: Build and deploy ${{ matrix.app }} (SWA)
    runs-on: ubuntu-24.04
    needs: [infra, test-frontend, migrate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: secondlook
            swa: web_swa
          - app: admin
            swa: admin_swa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Angular workspace deps
        working-directory: frontend
        run: npm ci

      - name: Point the app at the API
        run: |
          file="frontend/projects/${{ matrix.app }}/src/environments/environment.prod.ts"
          sed -i "s|apiBaseUrl: ''|apiBaseUrl: '${{ needs.infra.outputs.api_origin }}'|" "$file"
          grep apiBaseUrl "$file"

      - name: Build libraries and app
        working-directory: frontend
        run: |
          npx ng build api
          npx ng build components
          npx ng build ${{ matrix.app }} --configuration production

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read the deployment token
        id: token
        run: |
          swa='${{ matrix.app == 'admin' && needs.infra.outputs.admin_swa || needs.infra.outputs.web_swa }}'
          token="$(az staticwebapp secrets list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$swa" \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: frontend/dist/${{ matrix.app }}/browser
          skip_app_build: true
          skip_api_build: true

  # Proves the stack answers after a deploy. The F1 API sleeps when idle, so
  # the first request retries while it wakes.
  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    needs: [infra, api, web]
    steps:
      - name: API is ready
        run: |
          curl -fsS --retry 10 --retry-delay 15 --retry-all-errors --max-time 60 \
            "${{ needs.infra.outputs.api_origin }}/health/ready"

      - name: SPA deep routes serve their shells
        run: |
          check() {
            body="$(curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://$1/sign-in")"
            grep -q "<$2" <<<"$body" || { echo "::error::https://$1/sign-in did not serve the SPA shell"; exit 1; }
            echo "https://$1/sign-in -> OK"
          }
          check "${{ needs.infra.outputs.web_host }}" sl-root
          check "${{ needs.infra.outputs.admin_host }}" sl-admin-root
